name: 핀 자동 제작
# 픽담 발행 글 → 핀 이미지 + 문구 → 텔레그램 전송(수동 게시). Pinterest API 승인 후에는
# markto.json의 publish.mode만 "pinterest"로 바꾸면 같은 워크플로가 자동 게시로 전환된다.
# 시각: 10:20 KST — 픽담 발행(07:00)·캐스토 쇼츠(08:09)와 겹치지 않게 띄웠다.
on:
  schedule:
    - cron: "20 1 * * *"     # 10:20 KST
  workflow_dispatch:
    inputs:
      count:
        description: "만들 핀 수 (비우면 markto.json의 per_run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: markto-daily-pin      # 수동 실행과 스케줄이 겹쳐 같은 글을 두 번 만들지 않도록
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: 의존성 (한글 폰트 포함)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt

      - name: 테스트
        run: python -m unittest discover -s tests

      - name: 글 수집 (큐 갱신)
        run: python collect.py

      - name: 핀 제작 + 전송
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID_PICKDAM: ${{ secrets.PINTEREST_BOARD_ID_PICKDAM }}
        run: python make_pin.py ${{ github.event.inputs.count }}

      - name: 기록 커밋 (queue.json · pins.json)
        run: |
          git config user.name markto-bot
          git config user.email markto@solvup.local
          # 함정: git add에 없는 경로를 나열하면 pathspec 에러가 나고 `|| true`가 그걸 삼켜
          # 커밋이 조용히 건너뛰어진다(캐스토 실측). 디렉터리 단위 -A 로 붙인다.
          #
          # dashboard/pins 도 반드시 붙인다 — 2026-09-09 첫 실행에서 data만 커밋되어
          # 핀 이미지가 레포에 올라가지 않았고, 대시보드가 이미지를 보여주지 못했다(실측).
          git add -A data dashboard/pins
          git commit -m "핀 기록 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음 — 커밋 생략"
          git pull --rebase --autostash origin main && git push origin main

      - name: 핀 이미지 보존 (텔레그램 실패 대비 14일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pins-${{ github.run_number }}
          path: out/*.png
          retention-days: 14
          if-no-files-found: ignore
