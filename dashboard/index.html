<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Markto — 핀터레스트 유입</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F5A46A">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Markto">
<style>
/* ═══════════════════════════════════════════════════════════════════
   마크토 대시보드 build 2 — 파스텔 오렌지 (#F5A46A)
   색 규칙(대비 실측으로 정한 값이니 임의로 합치지 말 것):
   · --brand #F5A46A : 면·틴트·글로우 전용. 라이트 카드 위 글자로는 1.90:1로 안 읽힌다.
   · --ink   #C2662E : 작은 글자·활성 표시. 라이트 3.46 / 다크 4.63
   · 파스텔 면 위 글자는 #4A3728 (5.57:1). 흰 글자 금지(2.02:1).
   핀 이미지 팔레트는 여기와 무관 — 핀은 픽담 브랜드 그린을 쓴다(도착지가 픽담이므로).

   build 2 구조 원칙: **매일 하는 일이 첫 화면 위쪽에 온다.**
   1회용(준비 체크리스트)은 다 끝나면 한 줄로 접힌다. 설명은 줄이고 아이콘·번호로 대체.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --brand:#F5A46A; --ink:#F5A46A; --ink-2:#E98A4F;
  --bg:#100c09; --card:#1b1512; --card2:#241c17; --line:#332720;
  --txt:#f7f3f0; --muted:#a89a90; --ok:#34d399; --warn:#fbbf24; --danger:#fb7185;
  --tint:rgba(245,164,106,.16); --glow:rgba(245,164,106,.22); --ring:rgba(245,164,106,.45);
  --radius:12px;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
html[data-theme="light"]{
  --brand:#F5A46A; --ink:#C2662E; --ink-2:#A8551F;
  --bg:#FFF6EF; --card:rgba(255,255,255,.72); --card2:rgba(255,255,255,.9);
  --line:rgba(194,102,46,.16);
  --txt:#4A3728; --muted:#9C8776; --ok:#3d9e7d; --warn:#c9911f; --danger:#e0697f;
  --tint:rgba(245,164,106,.20); --glow:rgba(245,164,106,.30); --ring:rgba(245,164,106,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",
    "맑은 고딕",system-ui,sans-serif;
  padding-bottom:calc(24px + var(--safe-b));-webkit-font-smoothing:antialiased}
html[data-theme="light"] body{
  background:
    radial-gradient(1100px 520px at 10% -8%, #FFE8D5 0%, transparent 60%),
    radial-gradient(900px 460px at 106% 10%, #FFF0E0 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed}
h1,h2{margin:0;letter-spacing:-.02em}
a{color:var(--ink);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ── 헤더: 로고 · 상태 한 줄 · 스위처 · 실행 ── */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(9px + var(--safe-t)) 12px 9px;background:var(--tint);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
header img{border-radius:9px;flex:0 0 auto}
.hd{min-width:0;flex:1}
.hd h1{font-size:16px;font-weight:800;line-height:1.15}
/* 상태 한 줄 — build 1의 타일 3개(오늘/큐/누적)를 여기로 합쳤다.
   '누적 핀'은 뺐다: 성과 지표가 핀 개수가 아니라 클릭 수라서 매일 볼 값이 아니다. */
.hd .st{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hd .st b{color:var(--ink);font-variant-numeric:tabular-nums}
.icon-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:13px;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;padding:0}
.icon-btn:active{transform:translateY(1px)}
.appsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  flex:0 0 auto;height:30px;background:var(--card)}
.appsw a{display:flex;align-items:center;justify-content:center;width:24px;
  font-size:10.5px;font-weight:800;color:var(--muted);transition:background .16s,color .16s}
.appsw a+a{border-left:1px solid var(--line)}
.appsw a[data-hue="s"]:hover{color:#8b5cf6}
.appsw a[data-hue="p"]:hover{color:#2e9e6b}
.appsw a[data-hue="c"]:hover{color:#5b8def}
.appsw a[data-hue="m"]:hover{color:var(--ink)}
.appsw a.on[data-hue="s"]{background:rgba(139,92,246,.16);color:#8b5cf6}
.appsw a.on[data-hue="p"]{background:rgba(46,158,107,.16);color:#2e9e6b}
.appsw a.on[data-hue="c"]{background:rgba(91,141,239,.16);color:#5b8def}
.appsw a.on[data-hue="m"]{background:var(--tint);color:var(--ink)}

/* ── 알림 바(갱신·설치·오류) ── */
.bar-note{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12.5px;
  background:var(--tint);border-bottom:1px solid var(--line);color:var(--txt)}
.bar-note.err{background:rgba(251,113,133,.14)}
.bar-note button{margin-left:auto;font-size:12px;font-weight:800;padding:5px 10px;
  border-radius:8px;border:0;background:var(--brand);color:#4A3728;cursor:pointer}

/* ── 카드 ── */
.wrap{padding:12px 12px 0;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;margin-bottom:10px;backdrop-filter:blur(10px)}
html[data-theme="light"] .card{box-shadow:0 10px 28px -18px var(--glow)}
.card>h2{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:9px;
  display:flex;align-items:center;gap:6px}
.card>h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:999px;background:var(--tint);color:var(--ink);
  border:1px solid var(--line);white-space:nowrap}
.badge.warn{background:rgba(251,191,36,.16);color:var(--warn);border-color:transparent}
.badge.ok{background:rgba(52,211,153,.16);color:var(--ok);border-color:transparent}

/* ── 핀 카드 (오늘 할 일) ── */
.pin{border-top:1px solid var(--line);padding:12px 0}
.pin:first-of-type{border-top:0;padding-top:0}
.pin.done{opacity:.5}
.pin .top{display:flex;gap:10px}
.pin .thumb{width:66px;height:99px;border-radius:8px;flex:0 0 auto;background:var(--card2);
  border:1px solid var(--line);overflow:hidden;position:relative;cursor:zoom-in}
.pin .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pin .thumb .gone{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;text-align:center;font-size:10px;color:var(--muted);padding:4px}
.pin .ttl{font-size:14px;font-weight:800;line-height:1.35}
.pin .dsc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pin .tags{font-size:11.5px;color:var(--ink);margin-top:5px;font-weight:700}

/* 3단 복사 — 핀터레스트 업로드 순서(제목→설명→링크)를 번호로 못박는다.
   글자 라벨을 번호+아이콘으로 줄여 375px에서 한 줄에 들어간다(build 1은 2줄로 접혔다). */
.steps{display:flex;gap:6px;margin-top:10px}
.step{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:12px;font-weight:700;padding:8px 4px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card2);color:var(--txt);min-width:0}
.step .n{width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--muted);
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto}
.step.on{border-color:transparent;background:var(--tint);color:var(--ink)}
.step.on .n{background:var(--brand);color:#4A3728}
.step:active{transform:translateY(1px)}
.acts{display:flex;gap:6px;margin-top:6px}
.btn{font-size:12.5px;font-weight:800;padding:8px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card2);color:var(--txt);
  display:flex;align-items:center;justify-content:center;gap:5px}
.btn.primary{background:var(--brand);border-color:transparent;color:#4A3728}
.btn.grow{flex:1}
.btn:active{transform:translateY(1px)}

/* ── 준비 체크리스트 (완료되면 한 줄로 접힌다) ── */
#setupCard.folded>h2{margin-bottom:0}
#setupCard.folded #setupBody{display:none}
.chk{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.chk:first-child{border-top:0}
.chk input{appearance:none;width:19px;height:19px;flex:0 0 auto;margin:1px 0 0;
  border:1.5px solid var(--line);border-radius:6px;background:var(--card2);cursor:pointer;
  position:relative}
.chk input:checked{background:var(--brand);border-color:var(--brand)}
.chk input:checked::after{content:"";position:absolute;left:5.5px;top:2px;width:5px;height:9px;
  border:solid #4A3728;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.chk .t{font-size:13.5px;font-weight:700}
.chk .d{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.45}
.chk input:checked~div .t{color:var(--muted);text-decoration:line-through}
.chk input:checked~div .d{display:none}   /* 끝난 항목의 설명은 지운다 — 화면을 비워준다 */

.empty{text-align:center;color:var(--muted);font-size:13px;padding:16px 6px;line-height:1.65}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;
  color:var(--muted);font-size:11px;padding:12px 0 4px;flex-wrap:wrap}
.foot a{color:var(--muted);text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));
  background:var(--brand);color:#4A3728;font-size:13px;font-weight:800;padding:9px 16px;
  border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
/* 이미지 확대 — iOS에서 사진 저장은 '길게 누르기'라 새 탭보다 확대가 맞다 */
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.86);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:78vh;border-radius:10px}
.lb .hint{color:#fff;font-size:12.5px;opacity:.85}
</style>
</head>
<body>

<header>
  <img src="./icons/icon-192.png" alt="Markto" width="30" height="30">
  <div class="hd">
    <h1>Markto</h1>
    <div class="st" id="stLine">불러오는 중…</div>
  </div>
  <nav class="appsw" aria-label="앱 전환">
    <a data-hue="s" href="https://one2k87.github.io/Scripto/dashboard/" title="Scripto">S</a>
    <a data-hue="p" href="https://one2k87.github.io/Picto/dashboard/" title="Picto">P</a>
    <a data-hue="c" href="https://one2k87.github.io/Casto/dashboard/" title="Casto">C</a>
    <a class="on" data-hue="m" href="#" onclick="return false" title="Markto">M</a>
  </nav>
  <a class="icon-btn" id="runBtn" href="https://github.com/one2k87/Markto/actions/workflows/daily-pin.yml"
     target="_blank" rel="noopener" title="지금 핀 만들기 (Actions)" aria-label="지금 핀 만들기">▶</a>
  <button class="icon-btn" id="reload" title="새로고침" aria-label="새로고침">↻</button>
</header>

<div class="bar-note" id="updBar" hidden>
  <span>새 버전이 있습니다</span><button id="updBtn">갱신</button>
</div>
<div class="bar-note" id="instBar" hidden>
  <span>📲 홈 화면에 추가하면 앱처럼 쓸 수 있어요 — 공유 → 홈 화면에 추가</span>
  <button id="instX">닫기</button>
</div>
<div class="bar-note err" id="errBar" hidden>
  <span id="errTxt"></span><button id="errBtn">다시</button>
</div>

<div class="wrap">

  <!-- ① 매일 하는 일 — 최상단 -->
  <div class="card">
    <h2><span class="dot"></span>올릴 핀
      <span class="badge" id="pendBadge" style="margin-left:auto">–</span></h2>
    <div id="pinList"><div class="empty">불러오는 중…</div></div>
  </div>

  <!-- ② 준비 — 다 끝나면 한 줄로 접힌다 -->
  <div class="card" id="setupCard">
    <h2><span class="dot"></span>핀터레스트 준비
      <span class="badge" id="setupBadge" style="margin-left:auto">–</span>
      <button class="icon-btn" id="foldBtn" style="width:24px;height:24px;font-size:11px"
        title="펼치기·접기" aria-label="펼치기·접기">⌃</button></h2>
    <div id="setupBody">
      <div id="setup"></div>
      <div class="acts" style="margin-top:10px">
        <a class="btn grow" href="https://github.com/one2k87/Markto/blob/main/docs/%ED%95%80%ED%84%B0%EB%A0%88%EC%8A%A4%ED%8A%B8_%EA%B3%84%EC%A0%95_%EC%A4%80%EB%B9%84.md"
           target="_blank" rel="noopener">📖 준비 가이드</a>
        <a class="btn grow" href="https://analytics.pinterest.com/" target="_blank" rel="noopener">📈 핀 클릭 보기</a>
      </div>
    </div>
  </div>

  <div class="foot">
    <span id="buildTxt"></span>
    <a href="#" id="themeBtn">테마</a>
    <a href="#" id="resetBtn">진행 초기화</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   APP_BUILD — 배포마다 +1 (versions.md의 M 행과 맞춘다)
   localStorage 키는 반드시 `markto_` 접두 (공유_경계.md 3-2 강제:
   네 앱이 one2k87.github.io 한 오리진에 살아 저장소가 물리적으로 공유된다)
   ══════════════════════════════════════════════════════════════════════ */
const APP_BUILD = 2;
const K = {
  theme:    "markto_theme",
  progress: "markto_progress",   // {pinKey:{t,d,l,done,at}} — 복사 진행까지 기억한다
  posted:   "markto_posted",     // build 1 유산(완료 여부만) — 1회 이관 후 지운다
  setup:    "markto_setup",
  instHide: "markto_inst_hide",
  build:    "markto_build"
};
const PROGRESS_TTL_DAYS = 90;    // 오래된 진행 기록은 지운다(오리진을 4앱이 나눠 쓴다)
const RUN_AT = "10:20";          // 워크플로 실행 시각(KST) — daily-pin.yml과 맞춘다

const $ = (id) => document.getElementById(id);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }
              catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k)    { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ── 테마 ── */
(function initTheme(){
  const saved = ls.get(K.theme, null);
  const dark = saved === null
    ? window.matchMedia("(prefers-color-scheme: dark)").matches
    : saved === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
$("themeBtn").onclick = (e) => {
  e.preventDefault();
  const el = document.documentElement;
  const next = el.dataset.theme === "dark" ? "light" : "dark";
  el.dataset.theme = next; ls.set(K.theme, next);
};
$("reload").onclick = () => location.reload();

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1500);
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

async function copy(text, what){
  try { await navigator.clipboard.writeText(text); toast(what + " 복사"); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
    toast(ok ? what + " 복사" : "복사 실패 — 길게 눌러 선택하세요");
    return ok;
  }
}

/* ── 진행 기록 (복사 단계까지 기억) ────────────────────────────────────
   build 1은 '게시했음' 하나만 기억해서, 제목까지 붙이고 앱을 나갔다 오면
   어디까지 했는지 화면이 몰랐다. 단계별로 남긴다. */
function loadProgress(){
  const p = ls.get(K.progress, null);
  if (p) return prune(p);
  // build 1 → 2 이관 (한 번만)
  const old = ls.get(K.posted, null);
  const out = {};
  if (old) {
    Object.keys(old).forEach((k) => { if (old[k]) out[k] = { done: true, at: Date.now() }; });
    ls.set(K.progress, out); ls.del(K.posted);
  }
  return out;
}
function prune(p){
  const cut = Date.now() - PROGRESS_TTL_DAYS * 864e5;
  let changed = false;
  Object.keys(p).forEach((k) => {
    if (!p[k] || (p[k].at || 0) < cut) { delete p[k]; changed = true; }
  });
  if (changed) ls.set(K.progress, p);
  return p;
}
let PROG = loadProgress();
function setProg(key, patch){
  PROG[key] = Object.assign({ at: Date.now() }, PROG[key] || {}, patch, { at: Date.now() });
  ls.set(K.progress, PROG);
}

/* ── 준비 체크리스트 — 설명은 짧게, 끝나면 사라진다 ── */
const SETUP = [
  ["biz",   "비즈니스 계정",        "픽담 전용으로 새로 (개인 계정과 분리)"],
  ["prof",  "프로필 채우기",        "로고·소개·사용자명"],
  ["claim", "사이트 소유권 확인",   "Rank Math → 웹마스터 도구 → Pinterest"],
  ["board", "보드 「픽담 살까 말까」", "이름이 글자 그대로 같아야 한다"],
  ["secret","시크릿 3종",           "LLM_API_KEY · TELEGRAM_TOKEN · TELEGRAM_CHAT_ID"],
  ["api",   "API standard 승인",    "trial 핀은 Sandbox — 승인 전엔 수동 게시"]
];
function renderSetup(){
  const st = ls.get(K.setup, {});
  const done = SETUP.filter(([id]) => st[id]).length;
  const all = done === SETUP.length;

  $("setupBadge").textContent = all ? "완료 ✓" : done + "/" + SETUP.length;
  $("setupBadge").className = "badge" + (all ? " ok" : "");
  // 다 끝났으면 접는다 — 1회용 화면이 매일 스크롤을 만들지 않게(사용자가 다시 펼 수 있다)
  const folded = ls.get("markto_setup_folded", null);
  $("setupCard").classList.toggle("folded", folded === null ? all : folded === true);
  $("foldBtn").textContent = $("setupCard").classList.contains("folded") ? "⌄" : "⌃";

  $("setup").innerHTML = SETUP.map(([id, t, d]) => `
    <label class="chk">
      <input type="checkbox" data-sid="${esc(id)}"${st[id] ? " checked" : ""}>
      <div><div class="t">${esc(t)}</div><div class="d">${esc(d)}</div></div>
    </label>`).join("");
  $("setup").querySelectorAll("input[data-sid]").forEach((el) => {
    el.onchange = () => {
      const s = ls.get(K.setup, {}); s[el.dataset.sid] = el.checked; ls.set(K.setup, s);
      ls.set("markto_setup_folded", false);   // 방금 만졌으니 접지 않는다
      renderSetup();
    };
  });
}
$("foldBtn").onclick = (e) => {
  e.preventDefault(); e.stopPropagation();
  const f = !$("setupCard").classList.contains("folded");
  ls.set("markto_setup_folded", f); renderSetup();
};

/* ── 데이터 ─────────────────────────────────────────────────────────
   실패를 조용히 넘기지 않는다: build 1은 fetch가 깨져도 '0건'으로 보여서
   데이터를 못 읽은 것과 진짜 0건을 구분할 수 없었다(픽토·캐스토가 반복해 겪은 패턴). */
const nc = () => "?nc=" + Date.now();
async function getJson(path){
  try {
    const r = await fetch(path + nc(), { cache: "no-store" });
    if (!r.ok) return { ok: false, err: "HTTP " + r.status };
    return { ok: true, data: await r.json() };
  } catch (e) { return { ok: false, err: String(e.message || e) }; }
}

function pinKey(p){ return p.site + "#" + p.post_id + "@" + String(p.made_at || "").slice(0, 10); }
function imgPath(p){
  const raw = String(p.image || "");
  const base = raw.startsWith("out/") ? raw.slice(4) : raw.split("/").pop();
  return base ? "./pins/" + base : "";
}

/* 핀 이미지는 최근 30장만 레포에 남으므로, 밀려난 것은 404가 된다.
   조용히 숨기면 "왜 안 보이지"가 되니 이유를 그 자리에 쓴다.
   (함정: `this.remove()`를 먼저 하면 parentNode가 null이 되어 그 다음 줄이 터진다 — 실측) */
function imgFail(el){
  const box = el.parentNode;
  el.remove();
  if (box) box.insertAdjacentHTML("beforeend",
    '<div class="gone">이미지 만료<br>(최근 30장만 보관)</div>');
}

/* ── 이미지 확대(저장용) ── */
function lightbox(src){
  const el = document.createElement("div");
  el.className = "lb";
  el.innerHTML = `<img src="${esc(src)}" alt="">
    <div class="hint">이미지를 길게 눌러 사진에 저장 · 아무 곳이나 눌러 닫기</div>`;
  el.onclick = (e) => { if (e.target.tagName !== "IMG") el.remove(); };
  document.body.appendChild(el);
}

/* ── 핀 카드 ── */
let PINS = [], SITE = null;

function pinRow(p, i){
  const k = pinKey(p);
  const st = PROG[k] || {};
  const src = imgPath(p);
  const tags = (p.hashtags || []).map((t) => "#" + t).join(" ");
  const canShare = !!(navigator.canShare && navigator.share);
  return `<div class="pin${st.done ? " done" : ""}" data-i="${i}">
    <div class="top">
      <div class="thumb" data-act="zoom">
        ${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="imgFail(this)">` :
          `<div class="gone">이미지 없음</div>`}
      </div>
      <div style="min-width:0;flex:1">
        <div class="ttl">${esc(p.pin_title)}</div>
        <div class="dsc">${esc(p.pin_desc)}</div>
        ${tags ? `<div class="tags">${esc(tags)}</div>` : ""}
      </div>
    </div>
    <div class="steps">
      <button class="step${st.t ? " on" : ""}" data-act="t" aria-label="제목 복사">
        <span class="n">1</span>제목</button>
      <button class="step${st.d ? " on" : ""}" data-act="d" aria-label="설명 복사">
        <span class="n">2</span>설명</button>
      <button class="step${st.l ? " on" : ""}" data-act="l" aria-label="링크 복사">
        <span class="n">3</span>링크</button>
    </div>
    <div class="acts">
      ${canShare ? `<button class="btn grow" data-act="share">↗ 공유</button>` : ""}
      <button class="btn grow primary" data-act="done">${st.done ? "완료 ✓" : "게시했음"}</button>
    </div>
  </div>`;
}

function renderPins(){
  const pending = PINS.filter((p) => !(PROG[pinKey(p)] || {}).done);
  $("pendBadge").textContent = PINS.length
    ? (pending.length ? pending.length + "건 남음" : "모두 게시 ✓")
    : "0건";
  $("pendBadge").className = "badge" + (PINS.length && !pending.length ? " ok" : "");

  if (!PINS.length) {
    $("pinList").innerHTML = `<div class="empty">아직 만든 핀이 없습니다.<br>
      시크릿 3종을 넣으면 매일 <b>${RUN_AT}</b>에 만들어집니다 ·
      ▶ 를 눌러 지금 실행할 수도 있어요.</div>`;
    return;
  }
  // 남은 것만 보여준다 — 게시를 마친 핀이 계속 쌓이면 매일 스크롤이 길어진다.
  // 완료분은 접어두고 필요할 때만 펼친다(되돌릴 일이 있으므로 지우지는 않는다).
  const rows = PINS.map((p, i) => [p, i]);
  const left = rows.filter(([p]) => !(PROG[pinKey(p)] || {}).done);
  const done = rows.filter(([p]) => (PROG[pinKey(p)] || {}).done);
  const showDone = ls.get("markto_show_done", false);

  let html = left.map(([p, i]) => pinRow(p, i)).join("");
  if (!left.length) html = `<div class="empty">오늘 올릴 핀을 다 올렸습니다 ✓<br>
    다음 핀은 <b>${RUN_AT}</b>에 만들어집니다.</div>`;
  if (done.length) {
    html += `<div class="acts" style="margin-top:10px">
      <button class="btn grow" id="toggleDone">${showDone ? "완료 숨기기" : "완료 " + done.length + "건 보기"}</button>
    </div>`;
    if (showDone) html += done.map(([p, i]) => pinRow(p, i)).join("");
  }
  $("pinList").innerHTML = html;
  const tg = $("toggleDone");
  if (tg) tg.onclick = () => { ls.set("markto_show_done", !showDone); renderPins(); };
}

/* 카드 하나만 갱신 — build 1은 토글할 때마다 목록 전체를 다시 만들어
   스크롤이 튀고 이미지가 다시 로드됐다. */
function refreshRow(i){
  const el = $("pinList").querySelector(`.pin[data-i="${i}"]`);
  if (!el) return renderPins();
  el.outerHTML = pinRow(PINS[i], i);
  const pending = PINS.filter((p) => !(PROG[pinKey(p)] || {}).done).length;
  $("pendBadge").textContent = pending ? pending + "건 남음" : "모두 게시 ✓";
  $("pendBadge").className = "badge" + (pending ? "" : " ok");
}

/* 이벤트는 목록에 한 번만 위임 — 카드마다 붙이면 부분 갱신 때 다시 붙여야 한다 */
$("pinList").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const row = btn.closest(".pin");
  const i = Number(row.dataset.i);
  const p = PINS[i];
  const k = pinKey(p);
  const tags = (p.hashtags || []).map((t) => "#" + t).join(" ");
  const act = btn.dataset.act;

  if (act === "zoom") { const s = imgPath(p); if (s) lightbox(s); return; }
  if (act === "t") { if (await copy(p.pin_title, "제목")) { setProg(k, { t: 1 }); refreshRow(i); } return; }
  if (act === "d") { if (await copy(p.pin_desc + (tags ? "\n" + tags : ""), "설명")) { setProg(k, { d: 1 }); refreshRow(i); } return; }
  if (act === "l") { if (await copy(p.url, "링크")) { setProg(k, { l: 1 }); refreshRow(i); } return; }
  // 완료 토글은 목록에서 카드가 빠지거나 들어오므로 목록을 다시 그린다.
  // (복사 단계는 카드 안에서만 바뀌니 refreshRow로 부분 갱신한다)
  if (act === "done") { setProg(k, { done: !(PROG[k] || {}).done }); renderPins(); return; }

  if (act === "share") {
    // 이미지+문구를 시스템 공유 시트로 한 번에 — 핀터레스트 앱이 받으면 왕복이 줄어든다.
    // 파일 공유를 지원하지 않는 환경에서는 문구+링크만 공유한다(그것도 도움이 된다).
    const payload = { title: p.pin_title,
                      text: p.pin_title + "\n\n" + p.pin_desc + (tags ? "\n" + tags : ""),
                      url: p.url };
    try {
      const src = imgPath(p);
      if (src) {
        const blob = await (await fetch(src)).blob();
        const file = new File([blob], src.split("/").pop(), { type: blob.type || "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share(Object.assign({ files: [file] }, payload));
          setProg(k, { t: 1, d: 1, l: 1 }); refreshRow(i); return;
        }
      }
      await navigator.share(payload);
      setProg(k, { t: 1, d: 1, l: 1 }); refreshRow(i);
    } catch (err) {
      if (String(err.name) !== "AbortError") toast("공유를 열 수 없습니다");
    }
  }
});

/* ── 초기화 ── */
function showErr(msg){
  $("errTxt").textContent = msg;
  $("errBar").hidden = false;
}
$("errBtn").onclick = () => location.reload();

function kstToday(){
  const d = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
  return d.toISOString().slice(0, 10);
}

async function load(){
  const [pinsRes, queueRes, cfgRes] = await Promise.all([
    getJson("../data/pins.json"), getJson("../data/queue.json"), getJson("../markto.json")
  ]);
  const bad = [["핀 대장", pinsRes], ["큐", queueRes], ["설정", cfgRes]]
    .filter(([, r]) => !r.ok).map(([n, r]) => n + "(" + r.err + ")");
  if (bad.length) showErr("데이터를 읽지 못했습니다 — " + bad.join(", "));

  const cfg = cfgRes.ok ? cfgRes.data : null;
  PINS = ((pinsRes.ok && pinsRes.data && pinsRes.data.pins) || []).slice().reverse().slice(0, 12);
  const queue = (queueRes.ok && queueRes.data && queueRes.data.items) || [];
  SITE = cfg && (cfg.sites || []).find((s) => s.enabled);

  const perDay = (cfg && cfg.quota && cfg.quota.per_day) || 3;
  const today = kstToday();
  const madeToday = ((pinsRes.ok && pinsRes.data && pinsRes.data.pins) || [])
    .filter((p) => String(p.made_at || "").slice(0, 10) === today).length;

  const mode = cfg && cfg.publish ? cfg.publish.mode : "telegram";
  const tier = cfg && cfg.publish ? (cfg.publish.access_tier || "trial") : "trial";
  const auto = mode === "pinterest" && tier === "standard";

  // 헤더 상태 한 줄 — build 1의 타일 3개 + 상한 바 + 모드 배지를 여기로 합쳤다
  // 375px에서 잘리지 않게 짧게. 대상 사이트는 하나뿐이므로 매일 볼 값이 아니라 하단으로 뺐다.
  $("stLine").innerHTML =
    `오늘 <b>${madeToday}/${perDay}</b> · 큐 <b>${queue.length}</b> · ` +
    (auto ? "자동" : "수동");
  $("buildTxt").textContent = "build " + APP_BUILD + " · 매일 " + RUN_AT + " KST"
    + (SITE ? " · " + SITE.name : "");

  renderPins();
}

/* ── 새 버전 감지 — PWA는 캐시 때문에 옛 화면이 남을 수 있다 ── */
(function checkUpdate(){
  const seen = ls.get(K.build, 0);
  if (seen && seen < APP_BUILD) toast("새 버전 적용됨 (build " + APP_BUILD + ")");
  ls.set(K.build, APP_BUILD);
  // 배포된 index.html의 APP_BUILD를 읽어 지금 화면이 낡았는지 본다
  fetch("./index.html" + nc(), { cache: "no-store" }).then((r) => r.text()).then((t) => {
    const m = t.match(/APP_BUILD\s*=\s*(\d+)/);
    if (m && Number(m[1]) > APP_BUILD) $("updBar").hidden = false;
  }).catch(() => {});
})();
$("updBtn").onclick = () => {
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage("SKIP_WAITING");
  }
  location.reload();
};

/* ── 홈 화면 설치 안내 (iOS 사파리, 설치 전에만) ── */
(function installHint(){
  const standalone = window.navigator.standalone ||
    window.matchMedia("(display-mode: standalone)").matches;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (!standalone && ios && !ls.get(K.instHide, false)) $("instBar").hidden = false;
  $("instX").onclick = () => { ls.set(K.instHide, true); $("instBar").hidden = true; };
})();

$("resetBtn").onclick = (e) => {
  e.preventDefault();
  ls.del(K.progress); PROG = {}; renderPins(); toast("복사·게시 진행을 지웠습니다");
};

renderSetup();
load();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
